<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="../jovial/dist/index.full.js"></script>
    <title>主题切换测试</title>
    <style>
      /* 禁止滚动时的样式 */
      .no-scroll {
        overflow: hidden;
        touch-action: none;
      }

      .blog {
        padding: 2rem;
        transition: background-color 0.3s;
      }

      .blog-header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .article-list {
        max-width: 1200px;
        margin: 2rem auto;
        display: grid;
        gap: 2rem;
      }

      .article-card {
        padding: 1.5rem;
        border-radius: 8px;
        transition: all 0.3s;
      }

      /* 主题相关样式 */
      .theme-light {
        background-color: #ffffff;
        color: #000000;
      }

      .theme-dark {
        background-color: #bc2ac6;
        color: #ffffff;
      }

      .theme-light .article-card {
        background-color: #f5f5f5;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .theme-dark .article-card {
        background-color: #bc2ac6;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      ::view-transition-group(root) {
        animation-timing-function: var(--expo-in);
      }

      ::view-transition-new(root) {
        mask: url('https://s1.aigei.com/prevfiles/b9bbc0b0ffc64d39853931e15b897960.gif?e=2051020800&token=P7S2Xpzfz11vAkASLTkfHN7Fw-oOZBecqeJaxypL:vcPj6wj7-PKqyynTHxLXDI0fLrA=')
          center / 0 no-repeat;
        animation: scale 3s;
      }

      ::view-transition-old(root),
      .dark::view-transition-old(root) {
        animation: scale 3s;
      }

      @keyframes scale {
        0% {
          mask-size: 0;
        }
        10% {
          mask-size: 50vmax;
        }
        90% {
          mask-size: 50vmax;
        }
        100% {
          mask-size: 2000vmax;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div :class="['blog', theme]">
        <header class="blog-header">
          <h1>My Blog</h1>
          <button @click="toggleTheme">
            {{ theme === 'theme-light' ? '切换到暗色主题 🌙' : '切换到亮色主题 ☀️' }}
          </button>
        </header>

        <main class="article-list">
          <article class="article-card" v-for="article in articles" :key="article.title">
            <h2>{{ article.title }}</h2>
            <p>{{ article.summary }}</p>
            <time>{{ article.date }}</time>
          </article>
        </main>
      </div>
    </div>

    <script>
      const { createApp, ref } = Vue

      createApp({
        setup() {
          const theme = ref('theme-light')

          const articles = [
            {
              title: '使用 Vue 3 构建现代化应用',
              summary: '本文介绍如何使用 Vue 3 构建一个现代化的 Web 应用...',
              date: '2024-03-20',
            },
            {
              title: '深入理解 Vue 3 响应式系统',
              summary: '探索 Vue 3 响应式系统的工作原理...',
              date: '2024-03-18',
            },
            {
              title: '组件库开发实践',
              summary: '分享组件库开发中的经验和最佳实践...',
              date: '2024-03-15',
            },
          ]

          function toggleTheme() {
            if (!document.startViewTransition) {
              theme.value = theme.value === 'theme-light' ? 'theme-dark' : 'theme-light'
              return
            }
            // 禁止滚动
            document.documentElement.classList.add('no-scroll')

            document
              .startViewTransition(() => {
                theme.value = theme.value === 'theme-light' ? 'theme-dark' : 'theme-light'
              })
              .finished.then(() => {
                // 动画结束后恢复滚动
                document.documentElement.classList.remove('no-scroll')
              })
          }

          return {
            theme,
            articles,
            toggleTheme,
          }
        },
      }).mount('#app')
    </script>
  </body>
</html>
